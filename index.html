<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Royal Highway Racer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#game{width:100%;height:100%;overflow:hidden;background:#05070c}
body{font-family:Arial,sans-serif;user-select:none}
#game{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5}
.box{min-width:92px;padding:6px 10px;text-align:center;color:#fff;background:rgba(5,9,18,.8);border:1px solid #536071;border-radius:9px}
.box span{display:block;font-size:8px;letter-spacing:2px;color:#b7c6d8}
.box b{font-size:17px}
#fuelbar{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:min(300px,60vw);height:7px;background:#29313c;border-radius:10px;z-index:5;overflow:hidden}
#fuel{height:100%;width:100%;background:#20d9a0}
#pause{position:absolute;right:12px;top:12px;z-index:8;width:40px;height:40px;border-radius:50%;border:1px solid #687687;background:#0a0f18;color:white}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:radial-gradient(circle,rgba(14,35,58,.65),rgba(2,4,9,.96))}
.hidden{display:none!important}
h1{font-size:clamp(40px,9vw,90px);letter-spacing:6px;text-shadow:0 0 15px #00cfff,0 0 35px #1677ff}
.subtitle{margin:12px 0 28px;color:#9fb1c8;letter-spacing:4px}
.main{padding:14px 30px;border:0;border-radius:8px;background:#e9eef4;color:#07101a;font-weight:900;letter-spacing:2px;cursor:pointer}
.help{margin-top:20px;color:#8c9caf;font-size:13px;line-height:1.7}
#countdown{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;color:white;font-size:130px;font-weight:900;text-shadow:0 0 25px #00cfff;pointer-events:none}
#touch{position:absolute;bottom:18px;left:0;right:0;z-index:7;display:none;justify-content:center;gap:12px}
.touch{width:78px;height:56px;border:1px solid #697789;border-radius:12px;background:rgba(5,10,18,.75);color:#fff;font-weight:900}
#nitroTouch{width:100px;font-size:11px}
@media(max-width:700px){#hud{top:7px}.box{min-width:68px;padding:5px}.box b{font-size:14px}.box span{font-size:7px}#fuelbar{top:59px}#touch{display:flex}.help{display:none}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>

<div id="hud">
  <div class="box"><span>SPEED</span><b id="speed">0 km/h</b></div>
  <div class="box"><span>SCORE</span><b id="score">0</b></div>
  <div class="box"><span>DISTANCE</span><b id="distance">0 m</b></div>
</div>
<div id="fuelbar"><div id="fuel"></div></div>
<button id="pause">Ⅱ</button>

<div id="start" class="screen">
  <h1>ROYAL HIGHWAY</h1>
  <div class="subtitle">LUXURY TRAFFIC RACER</div>
  <button class="main" id="startBtn">START ENGINE</button>
  <div class="help">← → / A D = STEER<br>↑ / W / SPACE = NITRO<br>P = PAUSE</div>
</div>

<div id="over" class="screen hidden">
  <h1 style="font-size:clamp(35px,7vw,70px)">CRASHED</h1>
  <div class="subtitle">FINAL SCORE</div>
  <div id="final" style="font-size:60px;font-weight:900;margin-bottom:25px">0</div>
  <button class="main" id="again">RACE AGAIN</button>
</div>

<div id="countdown" class="hidden">3</div>

<div id="touch">
  <button class="touch" id="left">◀</button>
  <button class="touch" id="nitroTouch">NITRO</button>
  <button class="touch" id="right">▶</button>
</div>
</div>

<script>
"use strict";

/* ---------- setup ---------- */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* ---------- state ---------- */
let running=false,paused=false,counting=false,last=0;
let speed=0,score=0,distance=0,fuel=100;
let playerX=0,steerVelocity=0,roadScroll=0,spawnTimer=0;
let cars=[],particles=[],shake=0;
let best=Number(localStorage.getItem("royalBest")||0);

const key={left:false,right:false,nitro:false};
const lanes=[-.66,-.33,0,.33,.66];
const colors=["#15181d","#d9dde2","#243344","#64151d","#b08d2f"];

/* ---------- input ---------- */
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code)) e.preventDefault();
  if(e.code==="ArrowLeft"||e.code==="KeyA")key.left=true;
  if(e.code==="ArrowRight"||e.code==="KeyD")key.right=true;
  if(e.code==="ArrowUp"||e.code==="KeyW"||e.code==="Space")key.nitro=true;
  if(e.code==="KeyP")pauseGame();
});
addEventListener("keyup",e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA")key.left=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")key.right=false;
  if(e.code==="ArrowUp"||e.code==="KeyW"||e.code==="Space")key.nitro=false;
});

function bindTouch(id,name){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();key[name]=true};
  const off=e=>{e.preventDefault();key[name]=false};
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("pointerleave",off);
}
bindTouch("left","left");
bindTouch("right","right");
bindTouch("nitroTouch","nitro");

/* ---------- game controls ---------- */
document.getElementById("startBtn").onclick=startGame;
document.getElementById("again").onclick=startGame;
document.getElementById("pause").onclick=pauseGame;

function reset(){
  running=false;paused=false;counting=false;
  speed=0;score=0;distance=0;fuel=100;playerX=0;
  steerVelocity=0;roadScroll=0;spawnTimer=0;shake=0;
  cars=[];particles=[];
  updateHUD();
}

function startGame(){
  reset();
  document.getElementById("start").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
  doCountdown();
}

function doCountdown(){
  counting=true;
  const el=document.getElementById("countdown");
  el.classList.remove("hidden");
  let n=3; el.textContent=n;
  const timer=setInterval(()=>{
    n--;
    if(n>0) el.textContent=n;
    else{
      clearInterval(timer);
      el.textContent="GO!";
      setTimeout(()=>{
        el.classList.add("hidden");
        counting=false; running=true;
        last=performance.now();
        requestAnimationFrame(loop);
      },450);
    }
  },650);
}

function pauseGame(){
  if(!running||counting)return;
  paused=!paused;
  document.getElementById("pause").textContent=paused?"▶":"Ⅱ";
  if(!paused){
    last=performance.now();
    requestAnimationFrame(loop);
  }
}

/* ---------- road ---------- */
function road(y){
  const horizon=H*.22;
  let t=(y-horizon)/(H-horizon);
  t=Math.max(0,Math.min(1,t));
  const curve=Math.sin(roadScroll*.00135)*W*.10*t*t;
  const center=W/2+curve;
  const half=W*(.075+.43*t);
  return {center,left:center-half,right:center+half,t};
}
function laneX(lane,y){
  const r=road(y);
  return r.center+lane*W*(.10+.43*r.t);
}

/* ---------- traffic ---------- */
function spawn(){
  const lane=lanes[Math.floor(Math.random()*lanes.length)];
  cars.push({
    lane,
    y:H*.18-Math.random()*120,
    w:Math.max(34,W*.052),
    h:Math.max(60,H*.105),
    speed:.48+Math.random()*.55,
    color:colors[Math.floor(Math.random()*colors.length)],
    passed:false
  });
}

/* ---------- update ---------- */
function update(dt){
  const nitro=key.nitro&&fuel>0;
  const target=nitro?12:7.2;

  speed+=(target-speed)*dt*2.0;

  if(nitro)fuel=Math.max(0,fuel-20*dt);
  else fuel=Math.min(100,fuel+1.8*dt);

  const input=(key.right?1:0)-(key.left?1:0);

  if(input!==0){
    steerVelocity+=input*dt*6;
    playerX+=input*dt*(1.05+speed*.065);
  }else{
    steerVelocity*=Math.pow(.10,dt);
    playerX*=Math.pow(.72,dt);
  }

  playerX+=steerVelocity*dt;
  playerX=Math.max(-.78,Math.min(.78,playerX));

  roadScroll+=speed*dt*105;
  distance+=speed*dt*115;
  score+=speed*dt*11;

  spawnTimer-=dt;
  const interval=Math.max(.30,.95-Math.min(1,distance/100000)*.45);
  if(spawnTimer<=0){
    spawn();
    spawnTimer=interval*(.7+Math.random()*.5);
  }

  const py=H*.82, px=laneX(playerX,py);
  const pw=W*.10, ph=H*.16;

  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    c.y+=speed*dt*92*c.speed;
    const scale=.70+c.y/H*.55;
    const ex=laneX(c.lane,c.y);
    const ew=c.w*scale, eh=c.h*scale;

    if(Math.abs(ex-px)<(ew+pw)*.38 &&
       Math.abs(c.y-py)<(eh+ph)*.39){
      crash(px,py);
      return;
    }

    if(!c.passed&&c.y>py+75){
      c.passed=true;
      score+=50;
    }

    if(c.y>H+180)cars.splice(i,1);
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=450*dt;
    p.life-=dt*1.7;
    if(p.life<=0)particles.splice(i,1);
  }

  updateHUD();
}

function crash(x,y){
  shake=24;
  for(let i=0;i<90;i++){
    particles.push({
      x,y,
      vx:(Math.random()-.5)*800,
      vy:(Math.random()-.8)*750,
      life:1,
      size:2+Math.random()*6
    });
  }
  running=false;
  const final=Math.floor(score);
  if(final>best){
    best=final;
    localStorage.setItem("royalBest",String(best));
  }
  document.getElementById("final").textContent=final;
  setTimeout(()=>document.getElementById("over").classList.remove("hidden"),550);
}

/* ---------- drawing ---------- */
function roundRect(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H*.35);
  g.addColorStop(0,"#03050c");
  g.addColorStop(1,"#19364c");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="rgba(255,255,255,.7)";
  for(let i=0;i<70;i++){
    const x=(i*149)%W;
    const y=(i*67)%(H*.21);
    ctx.fillRect(x,y,i%5===0?2:1,i%5===0?2:1);
  }
}

function drawRoad(){
  drawSky();
  const hz=H*.22,far=road(hz),near=road(H);

  ctx.beginPath();
  ctx.moveTo(far.left,hz);
  ctx.lineTo(far.right,hz);
  ctx.lineTo(near.right,H);
  ctx.lineTo(near.left,H);
  ctx.closePath();

  const g=ctx.createLinearGradient(0,hz,0,H);
  g.addColorStop(0,"#111722");
  g.addColorStop(1,"#2b2f37");
  ctx.fillStyle=g;ctx.fill();

  ctx.strokeStyle="#d8e1ea";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(far.left,hz);ctx.lineTo(near.left,H);
  ctx.moveTo(far.right,hz);ctx.lineTo(near.right,H);
  ctx.stroke();

  for(const lane of [-.5,0,.5]){
    for(let j=0;j<23;j++){
      const y=hz+((j*105+roadScroll*2.2)%(H-hz+120));
      const y2=y+24+(y-hz)*.045;
      if(y<H){
        ctx.strokeStyle="rgba(255,255,255,.7)";
        ctx.lineWidth=1+(y-hz)/(H-hz)*3;
        ctx.beginPath();
        ctx.moveTo(laneX(lane,y),y);
        ctx.lineTo(laneX(lane,y2),y2);
        ctx.stroke();
      }
    }
  }
}

/* luxury sedan, inspired by classic ultra-luxury proportions */
function drawLuxuryCar(x,y,w,h,color){
  ctx.save();ctx.translate(x,y);

  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(0,h*.45,w*.55,h*.09,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(-w*.49,h*.43);
  ctx.lineTo(-w*.52,-h*.04);
  ctx.quadraticCurveTo(-w*.49,-h*.36,-w*.25,-h*.46);
  ctx.lineTo(w*.25,-h*.46);
  ctx.quadraticCurveTo(w*.49,-h*.36,w*.52,-h*.04);
  ctx.lineTo(w*.49,h*.43);
  ctx.closePath();ctx.fill();

  ctx.fillStyle="#111820";
  ctx.beginPath();
  ctx.moveTo(-w*.28,-h*.37);
  ctx.lineTo(-w*.17,-h*.56);
  ctx.lineTo(w*.17,-h*.56);
  ctx.lineTo(w*.29,-h*.37);
  ctx.closePath();ctx.fill();

  ctx.fillStyle="#071019";
  roundRect(-w*.22,-h*.35,w*.44,h*.17,3);ctx.fill();

  /* upright luxury grille */
  ctx.fillStyle="#d9dde0";
  ctx.beginPath();
  ctx.moveTo(-w*.13,-h*.02);ctx.lineTo(w*.13,-h*.02);
  ctx.lineTo(w*.10,h*.25);ctx.lineTo(-w*.10,h*.25);ctx.closePath();ctx.fill();

  ctx.strokeStyle="#747c83";ctx.lineWidth=1;
  for(let i=-3;i<=3;i++){
    ctx.beginPath();
    ctx.moveTo(i*w*.025,-h*.01);
    ctx.lineTo(i*w*.02,h*.22);
    ctx.stroke();
  }

  /* hood ornament */
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.moveTo(0,-h*.23);
  ctx.lineTo(-w*.035,-h*.13);
  ctx.lineTo(0,-h*.16);
  ctx.lineTo(w*.035,-h*.13);
  ctx.closePath();ctx.fill();

  ctx.fillStyle="#fff";ctx.shadowColor="#fff";ctx.shadowBlur=12;
  ctx.fillRect(-w*.40,-h*.07,w*.19,h*.075);
  ctx.fillRect(w*.21,-h*.07,w*.19,h*.075);
  ctx.shadowBlur=0;

  ctx.fillStyle="#9d1723";
  ctx.fillRect(-w*.41,h*.29,w*.18,h*.07);
  ctx.fillRect(w*.23,h*.29,w*.18,h*.07);

  ctx.fillStyle="#050505";
  ctx.fillRect(-w*.54,-h*.21,w*.10,h*.27);
  ctx.fillRect(w*.44,-h*.21,w*.10,h*.27);

  ctx.restore();
}

function drawPlayer(){
  const x=laneX(playerX,H*.82),y=H*.82,w=W*.10,h=H*.16;
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor="#00d9ff";ctx.shadowBlur=24;

  const g=ctx.createLinearGradient(-w/2,0,w/2,0);
  g.addColorStop(0,"#062038");
  g.addColorStop(.5,"#00bfe8");
  g.addColorStop(1,"#06364d");
  ctx.fillStyle=g;
  roundRect(-w/2,-h/2,w,h,11);ctx.fill();

  ctx.shadowBlur=0;
  ctx.fillStyle="#06131f";
  roundRect(-w*.31,-h*.32,w*.62,h*.27,5);ctx.fill();

  ctx.fillStyle="rgba(200,250,255,.35)";
  ctx.fillRect(-w*.24,-h*.28,w*.48,h*.045);

  ctx.fillStyle="#fff";ctx.shadowColor="#9eefff";ctx.shadowBlur=14;
  ctx.fillRect(-w*.39,-h*.08,w*.20,h*.08);
  ctx.fillRect(w*.19,-h*.08,w*.20,h*.08);
  ctx.shadowBlur=0;

  ctx.fillStyle="#050505";
  ctx.fillRect(-w*.53,-h*.20,w*.11,h*.28);
  ctx.fillRect(w*.42,-h*.20,w*.11,h*.28);

  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.life>.5?"#ffe08a":"#ff5938";
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;
}

function draw(){
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    shake*=.86;
  }
  drawRoad();
  cars.sort((a,b)=>a.y-b.y);
  for(const c of cars){
    const s=.70+c.y/H*.55;
    drawLuxuryCar(laneX(c.lane,c.y),c.y,c.w*s,c.h*s,c.color);
  }
  drawPlayer();
  drawParticles();
  ctx.restore();
}

function updateHUD(){
  document.getElementById("speed").textContent=Math.round(speed*24)+" km/h";
  document.getElementById("score").textContent=Math.floor(score);
  document.getElementById("distance").textContent=Math.floor(distance/100)+" m";
  document.getElementById("fuel").style.width=fuel+"%";
}

function loop(now){
  if(!running||paused){draw();return}
  const dt=Math.min(.035,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  if(running)requestAnimationFrame(loop);
}

/* ---------- initial render ---------- */
updateHUD();
draw();
</script>
</body>
</html>
