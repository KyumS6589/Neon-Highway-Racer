<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>Royal Highway Racer</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03050a;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ---------------- HUD ---------------- */

#hud{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:10;
}

.panel{
    min-width:95px;
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:9px;
    background:rgba(5,8,15,.78);
    backdrop-filter:blur(8px);
    color:white;
    text-align:center;
}

.panel span{
    display:block;
    font-size:9px;
    letter-spacing:2px;
    color:#b7c3d8;
}

.panel b{
    font-size:19px;
}

#pauseBtn{
    position:absolute;
    right:15px;
    top:15px;
    z-index:11;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(5,8,15,.8);
    color:white;
    cursor:pointer;
}

/* ---------------- FUEL ---------------- */

#fuelContainer{
    position:absolute;
    left:50%;
    top:76px;
    transform:translateX(-50%);
    width:min(330px,65vw);
    height:9px;
    background:rgba(255,255,255,.12);
    border-radius:20px;
    overflow:hidden;
    z-index:10;
}

#fuel{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#20e6a1,#00d9ff);
    transition:width .15s;
}

/* ---------------- SCREENS ---------------- */

.screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(
            circle at center,
            rgba(15,35,65,.65),
            rgba(2,4,9,.96)
        );
    color:white;
}

.hidden{
    display:none!important;
}

.screen h1{
    font-size:clamp(40px,9vw,95px);
    letter-spacing:7px;
    font-weight:900;
    color:#f4f7ff;
    text-shadow:
        0 0 8px rgba(255,255,255,.7),
        0 0 25px rgba(0,190,255,.8);
}

.screen h2{
    font-size:clamp(32px,7vw,70px);
    margin-bottom:10px;
}

.subtitle{
    color:#9caec7;
    letter-spacing:5px;
    margin:10px 0 30px;
}

button.main{
    padding:15px 32px;
    border:0;
    border-radius:8px;
    background:linear-gradient(
        135deg,
        #ffffff,
        #9cc9e8
    );
    color:#07101b;
    font-size:14px;
    font-weight:900;
    letter-spacing:2px;
    cursor:pointer;
    box-shadow:
        0 8px 30px rgba(0,200,255,.25);
}

button.main:hover{
    transform:translateY(-2px);
}

.instructions{
    margin-top:22px;
    color:#8998ae;
    font-size:13px;
    line-height:1.8;
}

/* ---------------- COUNTDOWN ---------------- */

#countdown{
    position:absolute;
    inset:0;
    z-index:25;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(80px,18vw,180px);
    font-weight:900;
    color:white;
    text-shadow:
        0 0 20px #00cfff,
        0 0 60px #0088ff;
    pointer-events:none;
}

/* ---------------- TOUCH ---------------- */

#touch{
    position:absolute;
    bottom:18px;
    left:0;
    right:0;
    display:none;
    justify-content:center;
    gap:12px;
    z-index:20;
}

.touch{
    width:78px;
    height:58px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(5,10,20,.72);
    color:white;
    font-weight:900;
    backdrop-filter:blur(6px);
}

.touch:active{
    background:rgba(0,180,255,.45);
}

#nitroTouch{
    width:100px;
    font-size:11px;
    letter-spacing:1px;
}

@media(max-width:700px){

    #hud{
        top:7px;
        gap:4px;
    }

    .panel{
        min-width:70px;
        padding:5px;
    }

    .panel b{
        font-size:15px;
    }

    .panel span{
        font-size:7px;
    }

    #fuelContainer{
        top:62px;
    }

    #touch{
        display:flex;
    }

    .instructions{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- HUD -->

<div id="hud">

    <div class="panel">
        <span>SPEED</span>
        <b id="speed">0</b>
    </div>

    <div class="panel">
        <span>SCORE</span>
        <b id="score">0</b>
    </div>

    <div class="panel">
        <span>DISTANCE</span>
        <b id="distance">0</b>
    </div>

</div>

<button id="pauseBtn">Ⅱ</button>

<div id="fuelContainer">
    <div id="fuel"></div>
</div>


<!-- START -->

<div id="startScreen" class="screen">

    <h1>ROYAL HIGHWAY</h1>

    <div class="subtitle">
        LUXURY TRAFFIC RACING
    </div>

    <button id="startBtn" class="main">
        START ENGINE
    </button>

    <div class="instructions">
        A / D or ← / → — STEER<br>
        W / ↑ / SPACE — NITRO<br>
        P — PAUSE
    </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen hidden">

    <h2>RACE OVER</h2>

    <div class="subtitle">
        FINAL SCORE
    </div>

    <div id="finalScore"
         style="
         font-size:65px;
         font-weight:900;
         color:#fff;
         margin-bottom:25px;
         ">
        0
    </div>

    <button id="restartBtn" class="main">
        DRIVE AGAIN
    </button>

</div>


<!-- COUNTDOWN -->

<div id="countdown" class="hidden">
    3
</div>


<!-- TOUCH -->

<div id="touch">

    <button
        class="touch"
        id="left">
        ◀
    </button>

    <button
        class="touch"
        id="nitroTouch">
        NITRO
    </button>

    <button
        class="touch"
        id="right">
        ▶
    </button>

</div>

</div>


<script>

/* ==========================================================
   ROYAL HIGHWAY RACER
   Complete game in one HTML file
========================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let W,H,DPR;

function resize(){

    W=innerWidth;
    H=innerHeight;

    DPR=Math.min(
        devicePixelRatio||1,
        2
    );

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

addEventListener(
    "resize",
    resize
);

resize();


/* ==========================================================
   GAME VARIABLES
========================================================== */

let gameRunning=false;
let paused=false;
let countdownActive=false;

let lastTime=0;

let speed=0;
let score=0;
let distance=0;

let fuel=100;

let roadOffset=0;

let spawnTimer=0;

let playerX=0;

/*
    playerSteer is deliberately separate
    from playerX.

    This gives smooth and clearly visible
    left/right movement.
*/

let playerSteer=0;

let steeringVelocity=0;

let cars=[];

let particles=[];

let roadCurve=0;

let worldTime=0;

let cameraShake=0;


const keys={
    left:false,
    right:false,
    nitro:false
};


/* ==========================================================
   BEST SCORE
========================================================== */

let bestScore=
    Number(
        localStorage.getItem(
            "royalHighwayBest"
        )||0
    );


/* ==========================================================
   KEYBOARD
========================================================== */

addEventListener(
    "keydown",
    e=>{

        if(
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowUp",
                "Space"
            ].includes(e.code)
        ){
            e.preventDefault();
        }


        if(
            e.code==="ArrowLeft"||
            e.code==="KeyA"
        ){
            keys.left=true;
        }


        if(
            e.code==="ArrowRight"||
            e.code==="KeyD"
        ){
            keys.right=true;
        }


        if(
            e.code==="ArrowUp"||
            e.code==="KeyW"||
            e.code==="Space"
        ){
            keys.nitro=true;
        }


        if(
            e.code==="KeyP"
        ){
            togglePause();
        }

    }
);


addEventListener(
    "keyup",
    e=>{

        if(
            e.code==="ArrowLeft"||
            e.code==="KeyA"
        ){
            keys.left=false;
        }


        if(
            e.code==="ArrowRight"||
            e.code==="KeyD"
        ){
            keys.right=false;
        }


        if(
            e.code==="ArrowUp"||
            e.code==="KeyW"||
            e.code==="Space"
        ){
            keys.nitro=false;
        }

    }
);


/* ==========================================================
   MOBILE CONTROLS
========================================================== */

function touchButton(
    id,
    key
){

    const el=
        document.getElementById(id);


    el.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );


    el.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );


    el.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );


    el.addEventListener(
        "pointerleave",
        ()=>{
            keys[key]=false;
        }
    );

}


touchButton("left","left");
touchButton("right","right");
touchButton("nitro","nitro");


/* ==========================================================
   START
========================================================== */

document
    .getElementById("startBtn")
    .onclick=startGame;


document
    .getElementById("restartBtn")
    .onclick=startGame;


function startGame(){

    resetGame();

    document
        .getElementById("startScreen")
        .classList
        .add("hidden");

    document
        .getElementById("gameOver")
        .classList
        .add("hidden");

    countdown();

}


/* ==========================================================
   RESET
========================================================== */

function resetGame(){

    gameRunning=false;
    paused=false;

    speed=0;
    score=0;
    distance=0;

    fuel=100;

    roadOffset=0;
    spawnTimer=0;

    playerX=0;
    playerSteer=0;
    steeringVelocity=0;

    roadCurve=0;
    worldTime=0;

    cars=[];
    particles=[];

    cameraShake=0;

    updateHUD();

}


/* ==========================================================
   COUNTDOWN
========================================================== */

function countdown(){

    countdownActive=true;

    const box=
        document.getElementById(
            "countdown"
        );

    box.classList.remove(
        "hidden"
    );

    let n=3;

    box.textContent=n;


    const timer=
        setInterval(()=>{

            n--;

            if(n>0){

                box.textContent=n;

            }
            else{

                box.textContent="GO!";

                setTimeout(()=>{

                    box.classList.add(
                        "hidden"
                    );

                    countdownActive=false;

                    gameRunning=true;

                    lastTime=
                        performance.now();

                    requestAnimationFrame(
                        loop
                    );

                },500);

                clearInterval(timer);

            }

        },700);

}


/* ==========================================================
   ROAD GEOMETRY
========================================================== */

function roadData(y){

    const horizon=H*.22;

    let t=
        (y-horizon)/
        (H-horizon);

    t=Math.max(
        0,
        Math.min(1,t)
    );


    /*
       Stronger curve near bottom.
       This makes steering visually obvious.
    */

    const curve =
        Math.sin(
            roadOffset*.0015
        ) * W*.09 * t*t;


    const center =
        W/2 + curve;


    const half =
        W*(
            .075 +
            .43*t
        );


    return {
        center:center,
        left:center-half,
        right:center+half,
        t:t
    };

}


/* ==========================================================
   LANE POSITION
========================================================== */

function lanePosition(
    lane,
    y
){

    const r=
        roadData(y);


    return r.center +
        lane *
        (
            W *
            (
                .10+
                .43*r.t
            )
        );

}


/* ==========================================================
   SPAWN TRAFFIC
========================================================== */

const trafficColors=[
    "#16181c",
    "#e5e7eb",
    "#263445",
    "#5c1118",
    "#d4af37"
];


function spawnTraffic(){

    const lanes=[
        -.65,
        -.325,
        0,
        .325,
        .65
    ];


    let lane=
        lanes[
            Math.floor(
                Math.random()*
                lanes.length
            )
        ];


    /*
       Traffic vehicle resembles
       a luxury Rolls-Royce-style sedan.
    */

    cars.push({

        lane:lane,

        y:H*.18-
          Math.random()*150,

        width:
            Math.max(
                32,
                W*.052
            ),

        height:
            Math.max(
                58,
                H*.105
            ),

        speed:
            .48+
            Math.random()*.55,

        color:
            trafficColors[
                Math.floor(
                    Math.random()*
                    trafficColors.length
                )
            ],

        passed:false,

        type:"royal"

    });

}


/* ==========================================================
   UPDATE
========================================================== */

function update(dt){

    worldTime+=dt;


    /* ---------------- SPEED ---------------- */

    const nitro=
        keys.nitro &&
        fuel>0;


    let targetSpeed=
        nitro
        ? 12
        : 7.2;


    /*
       Smooth acceleration.
    */

    speed +=
        (
            targetSpeed-speed
        )*
        dt*
        1.8;


    /* ---------------- FUEL ---------------- */

    if(nitro){

        fuel -=
            18*dt;

        if(fuel<0)
            fuel=0;

    }
    else{

        fuel +=
            1.7*dt;

        if(fuel>100)
            fuel=100;

    }


    /* ---------------- STEERING ---------------- */

    const steerInput=
        (keys.right?1:0)-
        (keys.left?1:0);


    /*
       ACCELERATED STEERING

       This is the important fix:
       pressing left/right now changes
       steering velocity, producing obvious
       horizontal movement.
    */

    steeringVelocity +=
        steerInput *
        dt *
        5.5;


    /* resistance */

    steeringVelocity *=
        Math.pow(
            .12,
            dt
        );


    /*
       Additional direct steering
       prevents sluggish controls.
    */

    if(steerInput!==0){

        playerSteer +=
            steerInput *
            dt *
            (
                .9+
                speed*.075
            );

    }


    playerSteer +=
        steeringVelocity*dt;


    /*
       Automatic return toward road center
       when player releases controls.
    */

    if(steerInput===0){

        playerSteer *=
            Math.pow(
                .72,
                dt
            );

    }


    playerX =
        playerSteer;


    playerX=
        Math.max(
            -.78,
            Math.min(
                .78,
                playerX
            )
        );


    /* ---------------- ROAD ---------------- */

    roadOffset +=
        speed*
        dt*
        105;


    roadCurve=
        Math.sin(
            roadOffset*.0015
        );


    /* ---------------- DISTANCE ---------------- */

    distance +=
        speed*
        dt*
        115;


    /* ---------------- SCORE ---------------- */

    score +=
        speed*
        dt*
        11;


    /* ---------------- TRAFFIC SPAWN ---------------- */

    spawnTimer-=dt;


    const difficulty=
        Math.min(
            1,
            distance/100000
        );


    const interval=
        Math.max(
            .30,
            .95-
            difficulty*.45
        );


    if(spawnTimer<=0){

        spawnTraffic();

        spawnTimer=
            interval*
            (
                .65+
                Math.random()*.55
            );

    }


    /* ---------------- PLAYER ---------------- */

    const playerY=
        H*.82;


    const playerWidth=
        W*.095;


    const playerHeight=
        H*.155;


    const playerCenter=
        lanePosition(
            playerX,
            playerY
        );


    /* ---------------- TRAFFIC ---------------- */

    for(
        let i=cars.length-1;
        i>=0;
        i--
    ){

        const car=cars[i];


        car.y +=
            speed*
            dt*
            92*
            car.speed;


        const scale=
            .70+
            car.y/H*.55;


        const enemyX=
            lanePosition(
                car.lane,
                car.y
            );


        const enemyW=
            car.width*
            scale;


        const enemyH=
            car.height*
            scale;


        /* COLLISION */

        const horizontal=
            Math.abs(
                enemyX-
                playerCenter
            );


        const vertical=
            Math.abs(
                car.y-
                playerY
            );


        if(
            horizontal <
            (
                enemyW+
                playerWidth
            )*.39
            &&
            vertical <
            (
                enemyH+
                playerHeight
            )*.40
        ){

            createCrash(
                playerCenter,
                playerY
            );

            endGame();

            return;

        }


        /* OVERTAKE */

        if(
            !car.passed &&
            car.y>
            playerY+80
        ){

            car.passed=true;

            score+=50;

        }


        if(
            car.y>
            H+180
        ){

            cars.splice(i,1);

        }

    }


    /* ---------------- PARTICLES ---------------- */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.x+=
            p.vx*dt;


        p.y+=
            p.vy*dt;


        p.vy+=
            400*dt;


        p.life-=
            dt*1.7;


        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }


    updateHUD();

}


/* ==========================================================
   CRASH
========================================================== */

function createCrash(
    x,
    y
){

    cameraShake=22;


    for(
        let i=0;
        i<90;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (
                    Math.random()-
                    .5
                )*750,

            vy:
                (
                    Math.random()-
                    .8
                )*700,

            life:1,

            size:
                2+
                Math.random()*6

        });

    }

}


/* ==========================================================
   END GAME
========================================================== */

function endGame(){

    gameRunning=false;


    const final=
        Math.floor(score);


    if(
        final>
        bestScore
    ){

        bestScore=final;

        localStorage.setItem(
            "royalHighwayBest",
            bestScore
        );

    }


    document
        .getElementById(
            "finalScore"
        )
        .textContent=
        final;


    setTimeout(()=>{

        document
            .getElementById(
                "gameOver"
            )
            .classList
            .remove("hidden");

    },600);

}


/* ==========================================================
   PAUSE
========================================================== */

function togglePause(){

    if(
        !gameRunning ||
        countdownActive
    )
        return;


    paused=!paused;


    document
        .getElementById(
            "pauseBtn"
        )
        .textContent=
        paused
        ? "▶"
        : "Ⅱ";


    if(!paused){

        lastTime=
            performance.now();

        requestAnimationFrame(
            loop
        );

    }

}


/* ==========================================================
   HUD
========================================================== */

function updateHUD(){

    document
        .getElementById(
            "speed"
        )
        .textContent=
        Math.round(
            speed*24
        )+
        " km/h";


    document
        .getElementById(
            "score"
        )
        .textContent=
        Math.floor(score);


    document
        .getElementById(
            "distance"
        )
        .textContent=
        Math.floor(
            distance/100
        )+
        " m";


    document
        .getElementById(
            "fuel"
        )
        .style.width=
        fuel+"%";

}


/* ==========================================================
   DRAW SKY
========================================================== */

function drawSky(){

    const g=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H*.35
        );


    const night=
        Math.sin(
            worldTime*.015
        )*.5+.5;


    g.addColorStop(
        0,
        "#03050c"
    );


    g.addColorStop(
        1,
        "#14283a"
    );


    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* stars */

    ctx.fillStyle=
        "rgba(255,255,255,.7)";


    for(
        let i=0;
        i<80;
        i++
    ){

        const x=
            (i*149)%W;


        const y=
            (i*67)%
            (H*.22);


        ctx.fillRect(
            x,
            y,
            i%4===0?2:1,
            i%4===0?2:1
        );

    }

}


/* ==========================================================
   DRAW ROAD
========================================================== */

function drawRoad(){

    drawSky();


    const horizon=
        H*.22;


    const far=
        roadData(
            horizon
        );


    const near=
        roadData(H);


    /* road */

    ctx.beginPath();

    ctx.moveTo(
        far.left,
        horizon
    );

    ctx.lineTo(
        far.right,
        horizon
    );

    ctx.lineTo(
        near.right,
        H
    );

    ctx.lineTo(
        near.left,
        H
    );

    ctx.closePath();


    const roadGradient=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );


    roadGradient.addColorStop(
        0,
        "#121722"
    );


    roadGradient.addColorStop(
        1,
        "#292d35"
    );


    ctx.fillStyle=
        roadGradient;


    ctx.fill();


    /* shoulders */

    ctx.strokeStyle=
        "#c7d1dc";


    ctx.lineWidth=4;


    ctx.shadowColor=
        "#8ea8c4";


    ctx.shadowBlur=7;


    ctx.beginPath();

    ctx.moveTo(
        far.left,
        horizon
    );

    ctx.lineTo(
        near.left,
        H
    );


    ctx.moveTo(
        far.right,
        horizon
    );

    ctx.lineTo(
        near.right,
        H
    );


    ctx.stroke();


    ctx.shadowBlur=0;


    /* lane lines */

    const lanes=[
        -.5,
        0,
        .5
    ];


    for(
        const lane of lanes
    ){

        for(
            let j=0;
            j<22;
            j++
        ){

            const y=
                horizon+
                (
                    (
                        j*110+
                        roadOffset*2.1
                    )
                    %
                    (
                        H-
                        horizon+
                        130
                    )
                );


            const y2=
                y+
                25+
                (
                    y-horizon
                )*.045;


            if(y<H){

                const x1=
                    lanePosition(
                        lane,
                        y
                    );


                const x2=
                    lanePosition(
                        lane,
                        y2
                    );


                ctx.strokeStyle=
                    "rgba(255,255,255,.65)";


                ctx.lineWidth=
                    1+
                    (
                        y-horizon
                    )/
                    (
                        H-horizon
                    )*3;


                ctx.beginPath();

                ctx.moveTo(
                    x1,
                    y
                );

                ctx.lineTo(
                    x2,
                    y2
                );

                ctx.stroke();

            }

        }

    }

}


/* ==========================================================
   DRAW ROLLS-ROYCE-STYLE LUXURY CAR
========================================================== */

function drawRoyalCar(
    x,
    y,
    w,
    h,
    color
){

    ctx.save();

    ctx.translate(x,y);


    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.35)";


    ctx.beginPath();

    ctx.ellipse(
        0,
        h*.46,
        w*.55,
        h*.10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle=color;


    ctx.beginPath();

    ctx.moveTo(
        -w*.48,
        h*.42
    );

    ctx.lineTo(
        -w*.51,
        -h*.05
    );

    ctx.quadraticCurveTo(
        -w*.48,
        -h*.37,
        -w*.24,
        -h*.47
    );

    ctx.lineTo(
        w*.25,
        -h*.47
    );

    ctx.quadraticCurveTo(
        w*.48,
        -h*.37,
        w*.51,
        -.05*h
    );

    ctx.lineTo(
        w*.48,
        h*.42
    );

    ctx.closePath();

    ctx.fill();


    /* roof */

    ctx.fillStyle=
        "#151a22";


    ctx.beginPath();

    ctx.moveTo(
        -w*.28,
        -h*.39
    );

    ctx.lineTo(
        -w*.17,
        -h*.58
    );

    ctx.lineTo(
        w*.18,
        -h*.58
    );

    ctx.lineTo(
        w*.30,
        -h*.39
    );

    ctx.closePath();

    ctx.fill();


    /* windows */

    ctx.fillStyle=
        "#0b121c";


    ctx.beginPath();

    ctx.moveTo(
        -w*.22,
        -h*.36
    );

    ctx.lineTo(
        -w*.14,
        -h*.51
    );

    ctx.lineTo(
        -w*.02,
        -h*.51
    );

    ctx.lineTo(
        -w*.02,
        -h*.36
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        w*.02,
        -h*.36
    );

    ctx.lineTo(
        w*.02,
        -h*.51
    );

    ctx.lineTo(
        w*.15,
        -h*.51
    );

    ctx.lineTo(
        w*.24,
        -h*.36
    );

    ctx.closePath();

    ctx.fill();


    /* chrome center */

    ctx.fillStyle=
        "#cbd2d8";


    ctx.fillRect(
        -w*.025,
        -h*.34,
        w*.05,
        h*.68
    );


    /* iconic upright grille */

    ctx.fillStyle=
        "#d9dde0";


    ctx.beginPath();

    ctx.moveTo(
        -w*.13,
        -h*.05
    );

    ctx.lineTo(
        w*.13,
        -h*.05
    );

    ctx.lineTo(
        w*.10,
        h*.25
    );

    ctx.lineTo(
        -w*.10,
        h*.25
    );

    ctx.closePath();

    ctx.fill();


    /* grille bars */

    ctx.strokeStyle=
        "#747c83";


    ctx.lineWidth=1;


    for(
        let i=-3;
        i<=3;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            i*w*.025,
            -h*.03
        );

        ctx.lineTo(
            i*w*.02,
            h*.22
        );

        ctx.stroke();

    }


    /* luxury emblem */

    ctx.fillStyle=
        "#ffffff";


    ctx.beginPath();

    ctx.moveTo(
        0,
        -h*.23
    );

    ctx.lineTo(
        -w*.035,
        -h*.13
    );

    ctx.lineTo(
        0,
        -h*.16
    );

    ctx.lineTo(
        w*.035,
        -h*.13
    );

    ctx.closePath();

    ctx.fill();


    /* headlights */

    ctx.fillStyle=
        "#f7fbff";


    ctx.shadowColor=
        "#ffffff";

    ctx.shadowBlur=12;


    ctx.fillRect(
        -w*.40,
        -h*.05,
        w*.20,
        h*.08
    );


    ctx.fillRect(
        w*.20,
        -h*.05,
        w*.20,
        h*.08
    );


    ctx.shadowBlur=0;


    /* rear lights */

    ctx.fillStyle=
        "#9c1824";


    ctx.fillRect(
        -w*.41,
        h*.28,
        w*.18,
        h*.07
    );


    ctx.fillRect(
        w*.23,
        h*.28,
        w*.18,
        h*.07
    );


    /* wheels */

    ctx.fillStyle=
        "#050505";


    ctx.fillRect(
        -w*.53,
        -h*.22,
        w*.10,
        h*.25
    );


    ctx.fillRect(
        w*.43,
        -h*.22,
        w*.10,
        h*.25
    );


    ctx.restore();

}


/* ==========================================================
   PLAYER CAR
========================================================== */

function drawPlayer(){

    const x=
        lanePosition(
            playerX,
            H*.82
        );


    const y=
        H*.82;


    const w=
        W*.10;


    const h=
        H*.16;


    ctx.save();

    ctx.translate(x,y);


    /* glow */

    ctx.shadowColor=
        "#00d9ff";


    ctx.shadowBlur=25;


    /* body */

    const body=
        ctx.createLinearGradient(
            -w/2,
            0,
            w/2,
            0
        );


    body.addColorStop(
        0,
        "#071a2b"
    );


    body.addColorStop(
        .5,
        "#00bfe8"
    );


    body.addColorStop(
        1,
        "#06334b"
    );


    ctx.fillStyle=body;


    ctx.beginPath();

    ctx.roundRect(
        -w/2,
        -h/2,
        w,
        h,
        12
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /* windshield */

    ctx.fillStyle=
        "#06121d";


    ctx.beginPath();

    ctx.roundRect(
        -w*.31,
        -h*.32,
        w*.62,
        h*.27,
        5
    );

    ctx.fill();


    /* blue reflection */

    ctx.fillStyle=
        "rgba(180,245,255,.30)";


    ctx.fillRect(
        -w*.25,
        -h*.29,
        w*.50,
        h*.05
    );


    /* headlights */

    ctx.fillStyle=
        "#ffffff";


    ctx.shadowColor=
        "#9eefff";


    ctx.shadowBlur=15;


    ctx.fillRect(
        -w*.38,
        -h*.08,
        w*.20,
        h*.08
    );


    ctx.fillRect(
        w*.18,
        -h*.08,
        w*.20,
        h*.08
    );


    ctx.shadowBlur=0;


    /* grille */

    ctx.fillStyle=
        "#07111c";


    ctx.fillRect(
        -w*.17,
        h*.15,
        w*.34,
        h*.13
    );


    /* wheels */

    ctx.fillStyle=
        "#050505";


    ctx.fillRect(
        -w*.53,
        -h*.20,
        w*.11,
        h*.28
    );


    ctx.fillRect(
        w*.42,
        -h*.20,
        w*.11,
        h*.28
    );


    ctx.restore();

}


/* ==========================================================
   PARTICLES
========================================================== */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life
            );


        ctx.fillStyle=
            p.life>.5
            ? "#ffd166"
            : "#ff5b35";


        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    }


    ctx.globalAlpha=1;

}


/* ==========================================================
   DRAW
========================================================== */

function draw(){

    ctx.save();


    if(cameraShake>0){

        ctx.translate(
            (
                Math.random()-
                .5
            )*
            cameraShake,

            (
                Math.random()-
                .5
            )*
            cameraShake
        );


        cameraShake*=.86;

    }


    drawRoad();


    /* distant traffic first */

    cars.sort(
        (a,b)=>
        a.y-b.y
    );


    for(
        const car of cars
    ){

        const scale=
            .70+
            car.y/H*.55;


        drawRoyalCar(

            lanePosition(
                car.lane,
                car.y
            ),

            car.y,

            car.width*scale,

            car.height*scale,

            car.color

        );

    }


    drawPlayer();

    drawParticles();


    ctx.restore();

}


/* ==========================================================
   MAIN LOOP
========================================================== */

function loop(time){

    if(
        !gameRunning ||
        paused
    ){

        draw();

        return;

    }


    const dt=
        Math.min(
            .035,
            (time-lastTime)/1000
        );


    lastTime=time;


    update(dt);

    draw();


    if(gameRunning){

        requestAnimationFrame(
            loop
        );

    }

}


/* ==========================================================
   PAUSE BUTTON
========================================================== */

document
    .getElementById(
        "pauseBtn"
    )
    .onclick=
    togglePause;


/* ==========================================================
   INITIAL
========================================================== */

draw();

</script>
